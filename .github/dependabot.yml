version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    commit-message:
      prefix: "🔐 security(root)"
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /rust
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    commit-message:
      prefix: "🔐 security(rust)"
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 0
    commit-message:
      prefix: "🔐 security(ci)"
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
