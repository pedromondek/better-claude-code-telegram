name: Lock pull requests

on:
  pull_request:
    types:
      - opened
  workflow_dispatch:

permissions: {}

concurrency:
  group: lock-pull-requests-${{ github.event.pull_request.number || 'open' }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  lock:
    name: Lock the conversation
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # gh pr lock limits the conversation of the pull request to who has write access
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Lock the conversation
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: npm run --silent pr:lock
