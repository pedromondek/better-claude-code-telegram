name: CI cache

on:
  pull_request:
    types:
      - closed
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: manage-ci-cache-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  delete:
    name: Delete the cache of the closed pull request
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write # gh cache delete removes the caches of the closed pull request's merge ref
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Delete the caches of the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: npm run --silent ci:cache:delete

  checks:
    name: Warm the cache of main · checks
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: $/.github/workflows/push-checks.yml

  rust:
    name: Warm the cache of main · Rust on macOS and Windows
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: $/.github/workflows/check-rust-platforms.yml

  mutation:
    name: Warm the cache of main · mutation
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
    uses: $/.github/workflows/check-mutation.yml
