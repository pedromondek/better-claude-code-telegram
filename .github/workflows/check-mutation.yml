name: Mutation

on:
  workflow_call:
    inputs:
      before:
        description: Base commit of the range to mutate; empty takes the merge-base with origin/main
        required: false
        type: string
        default: ""
      full:
        description: Mutate the Rust range from scratch, without the mutants already caught by earlier runs
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      full:
        description: Mutate the Rust range from scratch, without the mutants already caught by earlier runs
        required: true
        type: boolean
        default: true

permissions: {}

defaults:
  run:
    shell: bash

env:
  HUSKY: "0"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  plan:
    name: Plan the Rust mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      count: ${{ steps.plan.outputs.count }}
      shards: ${{ steps.plan.outputs.shards }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: cargo-mutants and nextest of mise.lock
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.19
          install_args: github:sourcefrog/cargo-mutants github:nextest-rs/nextest
          cache_save: ${{ github.ref == 'refs/heads/main' }}

      - name: Rust toolchain of rust-toolchain.toml
        run: rustup toolchain install

      - name: Mutants caught by earlier runs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rust/mutants.out
          key: rust-mutants-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          restore-keys: |
            rust-mutants-${{ github.head_ref || github.ref_name }}-
            rust-mutants-main-

      - name: Plan
        id: plan
        env:
          MUTATION_BEFORE: ${{ inputs.before }}
          RUST_MUTATION_FULL: ${{ inputs.full }}
        run: npm run --silent rust:mutation:ci -- plan

      - name: Keep the plan for the shards
        if: steps.plan.outputs.count != '0'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-mutation-plan
          path: rust-mutation-plan
          include-hidden-files: true
          retention-days: 7

  rust:
    name: Rust mutation · shard ${{ matrix.shard }}
    needs:
      - plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: cargo-mutants and nextest of mise.lock
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.19
          install_args: github:sourcefrog/cargo-mutants github:nextest-rs/nextest
          cache_save: ${{ github.ref == 'refs/heads/main' }}

      - name: Rust toolchain of rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          shared-key: mutation
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Plan of the shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rust-mutation-plan
          path: rust-mutation-plan

      - name: Shard
        env:
          RUST_MUTATION_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: npm run --silent rust:mutation:ci -- shard

      - name: Outcomes of the shard
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rust-mutants-shard-${{ matrix.shard }}
          path: rust/mutants.out
          include-hidden-files: true
          retention-days: 7

  outcomes:
    name: Keep the caught mutants
    needs:
      - plan
      - rust
    if: ${{ !cancelled() && needs.plan.outputs.count != '0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Plan and shard outcomes
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rust-*
          path: artifacts

      - name: Merge
        run: npm run --silent rust:mutation:ci -- merge artifacts/rust-mutation-plan/outcomes artifacts/rust-mutants-shard-*

      - name: Caught mutants for the next run
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rust/mutants.out
          key: rust-mutants-${{ github.head_ref || github.ref_name }}-${{ github.sha }}

  stryker:
    name: Stryker mutation
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: node_modules from the cache
        id: modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Incremental of the last mutation
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.sha }}
          restore-keys: stryker-incremental-

      - name: Mutation
        env:
          MUTATION_BEFORE: ${{ inputs.before }}
        run: npm run --silent test:mutation:prepush

      - name: Save the incremental
        if: github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: reports/stryker-incremental.json
          key: stryker-incremental-${{ github.sha }}
