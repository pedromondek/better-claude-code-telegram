name: Prepare release

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Stage of the next version, from the version in the repository
        required: true
        type: choice
        options:
          - alpha
          - beta
          - rc
          - stable
      version:
        description: Exact version, which wins over the stage (the first release or a jump the stage does not give)
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  group: prepare-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Compute the version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      approval: ${{ steps.plan.outputs.approval }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Tools of mise.lock
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.19

      - name: Next version, checked against every version released
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STAGE: ${{ inputs.stage }}
          VERSION: ${{ inputs.version }}
        run: npm run --silent release:pr -- plan "${VERSION:-$STAGE}"

  approval:
    name: Approve the minor or major
    needs: plan
    if: needs.plan.outputs.approval == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: release-approval
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Approved
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: echo "v$VERSION approved"

  prepare:
    name: Open the version pull request
    needs:
      - plan
      - approval
    if: always() && needs.plan.result == 'success' && (needs.plan.outputs.approval == 'false' || needs.approval.result == 'success')
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Tools of mise.lock
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.19

      - name: Token of the release app
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Version files, branch and pull request
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: npm run --silent release:pr -- prepare "$VERSION"
