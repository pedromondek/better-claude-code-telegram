name: Pull request notes

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - reopened
      - edited
      - synchronize
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request (number) whose patch notes to check
        required: true
        type: string

permissions: {}

concurrency:
  group: check-pull-request-notes-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  patch-notes:
    name: Patch notes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # reads the current description and head branch of the pull request, which a re-run keeps from the first event
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Patch notes in the description
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        run: npm run --silent pr:patch-notes -- check "$PR_NUMBER"
