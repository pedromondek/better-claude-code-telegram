name: Watch the official plugin

on:
  schedule:
    - cron: "0 8 */3 * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: watch-upstream
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  watch:
    name: New version of the official plugin
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # opens the issue of a new version of the official plugin, or comments the open one
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: New version of the official plugin
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: npm run --silent upstream:watch
