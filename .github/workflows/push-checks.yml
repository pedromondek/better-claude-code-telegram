name: Checks

on:
  workflow_call:
    inputs:
      pr:
        description: Merged pull request whose merge commit and range the checks validate; empty takes the range of the event
        required: false
        type: string
        default: ""
      pr_number:
        description: Another merged pull request (number), which wins over the select
        required: false
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      pr:
        description: Merged pull request whose merge commit and range the checks validate
        required: true
        type: choice
        options:
          - Last merged PR
          - Second to last merged PR
          - Third to last merged PR
      pr_number:
        description: Another merged pull request (number), which wins over the select
        required: false
        type: string
        default: ""

permissions: {}

defaults:
  run:
    shell: bash

env:
  HUSKY: "0"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  target:
    name: Merged pull request
    if: inputs.pr != '' || inputs.pr_number != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      label: ${{ steps.target.outputs.label }}
      sha: ${{ steps.target.outputs.sha }}
      before: ${{ steps.target.outputs.before }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Chosen pull request
        id: target
        env:
          PR_CHOICE: ${{ inputs.pr }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: npm run --silent merged-pr

  checks:
    name: ${{ needs.target.outputs.label != '' && format('Checks · {0}', needs.target.outputs.label) || 'Checks (the same as the pre-push)' }}
    needs:
      - target
    if: ${{ !cancelled() && needs.target.result != 'failure' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.target.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: node_modules from the cache
        id: modules
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('.nvmrc') }}-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Save node_modules
        if: github.ref == 'refs/heads/main' && steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: node_modules
          key: ${{ steps.modules.outputs.cache-primary-key }}

      - name: Tools of mise.lock
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.19
          cache_save: ${{ github.ref == 'refs/heads/main' }}

      - name: Rust toolchain of rust-toolchain.toml
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: rust
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Latest Claude Code CLI for the plugin manifests
        run: npm install --global @anthropic-ai/claude-code@latest

      - name: Checks
        env:
          BEFORE: ${{ needs.target.outputs.before || github.event.pull_request.base.sha || github.event.before }}
          PREPUSH_SKIP_MUTATION: "1"
        run: |
          set +e
          head=$(git rev-parse HEAD)
          printf 'refs/heads/ci %s refs/heads/ci %s\n' "$head" "${BEFORE:-0000000000000000000000000000000000000000}" | sh .husky/pre-push origin ci 2>&1 | tee gate.log
          code=${PIPESTATUS[1]}
          echo "### Checks: exit $code" >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(✓|✗|⚠)' gate.log >> "$GITHUB_STEP_SUMMARY" || true
          exit "$code"
