name: Online audit of the workflows

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to audit (the head of the pull request); empty audits the commit of the event
        required: false
        type: string
        default: ""
      before:
        description: Base of the range; the audit runs only when the range changes a workflow, an action, the lint config or mise
        required: false
        type: string
        default: ""
      force:
        description: Audits without looking at the range (weekly run)
        required: false
        type: boolean
        default: false
    outputs:
      ran:
        description: The audit ran, because the range changed a workflow or it was forced
        value: ${{ jobs.audit.outputs.ran }}
      exit:
        description: Exit code of the audit
        value: ${{ jobs.audit.outputs.exit }}
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  audit:
    name: Online audit of the workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: read # finds the open issue of the online audit, to link it from an inherited finding
    outputs:
      ran: ${{ steps.audit.outputs.ran }}
      exit: ${{ steps.audit.outputs.exit }}
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Tools of mise.lock
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: 2026.10.19

      - name: Online audit
        id: audit
        env:
          BEFORE: ${{ inputs.before }}
          FORCE: ${{ inputs.force || github.event_name == 'workflow_dispatch' }}
          LOG_FILE: workflow-audit.log
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ZIZMOR_GITHUB_TOKEN: ${{ github.token }}
          PINACT_GITHUB_TOKEN: ${{ github.token }}
        run: npm run --silent audit:workflows

      - name: Report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: workflow-audit-${{ inputs.ref || github.sha }}
          path: workflow-audit.log
          if-no-files-found: ignore
          retention-days: 30
