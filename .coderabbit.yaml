language: en-US
tone_instructions: >-
  Direct, no praise. Point only to what the changed line shows and cite the
  .claude rule when there is one. Correctness and security before style.
  Leave formatting to Prettier, rustfmt and the linters.
early_access: false
reviews:
  profile: chill
  auto_approvals:
    enabled: false
  slop_detection:
    enabled: true
    label: slop
  security_risk_instructions: |
    - The Telegram bot token lives in ~/.claude/channels/telegram/.env and a
      deny rule keeps Claude from reading it. Code that reads, prints, logs or
      sends the token, or passes it through Claude, is critical.
    - The bot answers only the paired account in access.json and refuses
      groups. A path that lets another chat drive Claude, approve a
      permission or answer a question is critical.
    - The hooks run on the user's machine, with the user's permissions, on
      every Claude Code event. Running anything built from message content
      (a command, a path, a URL) is critical.
    - The setup, health --fix, update and uninstall write in the user's HOME
      (shell rc, ~/.claude/settings.json, the app folder). Writing anywhere
      else, or without the journal that undoes it, is high.
    - The binary installs itself only after checking the sha256 listed in
      the checksums.txt of the plugin. Skipping or weakening that check is
      critical.
    - The CI has no secrets and a read-only token: every workflow starts
      with permissions {} and pins each action by SHA.
  merge_risk_instructions: |
    Higher risk: hooks.json and the plugin scripts that launch bcct, the Rust
    hook, launcher, setup, update and uninstall paths, anything that writes
    ~/.claude/settings.json or a shell rc, the plugin manifests and versions
    (a broken release breaks every installed session), upstream files under
    plugins/telegram/ outside extensions/, the pre-push and the workflows.
    Lower risk: docs, message catalog changes covered by the parity test,
    test-only changes and regenerated fixtures.
  high_level_summary: true
  high_level_summary_in_walkthrough: true
  review_status: true
  review_details: true
  sequence_diagrams: true
  estimate_code_review_effort: true
  assess_linked_issues: true
  related_issues: false
  related_prs: true
  suggested_labels: false
  auto_apply_labels: false
  suggested_reviewers: false
  in_progress_fortune: false
  poem: false
  enable_prompt_for_ai_agents: true
  abort_on_close: true
  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    ignore_title_keywords:
      - "WIP:"
  path_filters:
    - "!plugins/telegram/LICENSE"
    - "!plugins/telegram/README.md"
    - "!plugins/telegram/ACCESS.md"
    - "!plugins/telegram/bun.lock"
    - "!package-lock.json"
    - "!rust/Cargo.lock"
    - "!mise.lock"
    - "!**/__tests__/fixtures/**"
    - "!rust/crates/bcct/tests/fixtures/**"
  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: warning
      requirements: |
        The title starts with the four-digit key of the issue of the branch:
        `0042: Short title` for the branch `0042-short-title`. The CI checks
        the same with `npm run branch -- pr`.
    description:
      mode: "off"
    issue_assessment:
      mode: warning
  tools:
    eslint:
      enabled: true
    oxc:
      enabled: true
    clippy:
      enabled: true
    shellcheck:
      enabled: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    gitleaks:
      enabled: true
    osvScanner:
      enabled: true
    ast-grep:
      essential_rules: true
    biome:
      enabled: false
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
    yamllint:
      enabled: false
    hadolint:
      enabled: false
    trufflehog:
      enabled: false
  path_instructions:
    - path: "**/*.{ts,mjs,rs,sh}"
      instructions: |
        Vocabulary: finding = asks for a fix before the merge; suggestion =
        does not block; debt = a problem that was already there, mentioned
        apart and never blocking. The rules in .claude/ are the reference.

        Scope:
        - Only the code the change writes or activates is reviewed, plus the
          sibling spots of a pattern the change fixed in part.
        - Debt is not a finding, except a security flaw the change activates
          and that is exploitable now.
        - A line equal in `-` and `+` (moved or reindented) is not a finding.
        - Before saying "this is the repo pattern", count both styles.

        Severity comes from the path that reaches the defect: say who calls
        it. A cold path lowers the severity, it does not erase the finding.
        "Never called" holds only with the callers listed.

        Security: describe the class of the defect, who reaches it and the
        effect, never an exploit script. The bot token and the .env never
        pass through Claude.
    - path: "plugins/telegram/**"
      instructions: |
        Upstream copy of the official Telegram plugin. Outside
        plugins/telegram/extensions/, any change other than the exceptions
        listed in NOTICE is a finding, and an exception added without the
        NOTICE updated in the same pull request is a finding too.
    - path: "plugins/telegram/extensions/**/*.ts"
      instructions: |
        Strict TypeScript, zero `any`. Every message shown to
        the user exists in both languages of the catalog; a key in only one
        is a finding.
    - path: "rust/**/*.rs"
      instructions: |
        The binary ports the Node.js scripts by contract: a
        change in output, exit code or file written that the JS side did
        not get, or that its test does not lock, is a finding. Code with no
        test that would fail if it broke is a finding: the gate is 100% of
        lines and zero surviving mutants.
    - path: "**/__tests__/**"
      instructions: |
        - Point to an assertion that would not fail if the code broke.
        - A test never touches the real HOME, ~/.claude, the bot, the
          network or an installer: touching them is a finding.
        - Timers come from the injected clock, never real waits.
    - path: ".github/**"
      instructions: |
        - Never interpolate `${{ }}` with event data (title, branch, body)
          in `run:`; pass it through `env:` in quotes.
        - Permissions at the minimum: the workflow starts with
          `permissions: {}` and each job asks for its own.
        - Every action pinned by full SHA with the version comment, and
          `persist-credentials: false` on every checkout.
        - Never `pull_request_target` with a checkout of the PR head.
        - A cache is saved only on main, never on a pull request.
        - Every file in .github/ has its mirrored test in .github/__tests__/.
    - path: ".husky/**"
      instructions: |
        Hooks run in POSIX sh: no bashism. The pre-push runs the same steps
        as the CI; a step that blocks only on the developer machine, or only
        in CI, is a finding. A network or helper tool failure (git fetch,
        gh, timeout) never blocks.
    - path: ".claude/**"
      instructions: |
        - Hooks and skills must agree with .claude/CLAUDE.md and with the
          tests that lock them: a mismatch is an alignment finding that says
          which text is outdated.
        - settings*.json never holds a token or a credential.
chat:
  auto_reply: false
  allow_non_org_members: false
  art: false
issue_enrichment:
  auto_enrich:
    enabled: true
  planning:
    enabled: true
    auto_planning:
      enabled: false
  labeling:
    auto_apply_labels: false
knowledge_base:
  web_search:
    enabled: true
  learnings:
    scope: local
    approval_delay: 30
  issues:
    scope: local
  pull_requests:
    scope: local
  code_guidelines:
    enabled: true
    filePatterns:
      - .claude/CLAUDE.md
